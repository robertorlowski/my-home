# Jeden obraz my-home (serwer i klient) dla vm-prod (Oracle, arm64), publikowany w GitHub Container Registry.
# main to kanał prod, develop to kanał test. Tagi: <kanał> (najnowszy) i <kanał>-<commit>.
# Workflow tylko publikuje. Instalację na serwerze uruchamia oracle-cloud/vm-prod/deploy-my-home.sh. Render nie używa tego obrazu.
name: Obraz Docker

on:
  push:
    branches: [main, develop]
    paths:
      - server/**
      - client/**
      - package.json
      - package-lock.json
      - deploy/oracle/**
      - .dockerignore
      - .github/workflows/obraz-docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: obraz-docker-${{ github.ref_name }}

jobs:
  obraz:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CHANNEL: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
      IMAGE: ghcr.io/robertorlowski/my-home
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Logowanie do rejestru
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Bez provenance i sbom: obraz to jedna wersja pakietu, bez dodatkowych manifestów bez tagów.
      - name: Budowanie i publikacja
        run: |
          COMMIT=${GITHUB_SHA::12}
          docker buildx build --pull --push --platform linux/arm64 --provenance=false --sbom=false \
            -f deploy/oracle/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/robertorlowski/my-home \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$CHANNEL" -t "$IMAGE:$CHANNEL-$COMMIT" .
          echo "Opublikowano $IMAGE:$CHANNEL-$COMMIT" >> "$GITHUB_STEP_SUMMARY"

      # Decyzja właściciela: w każdym kanale aktualna wersja i 2 poprzednie.
      - name: Usuwanie starszych wersji
        run: |
          VERSIONS_URL=/users/robertorlowski/packages/container/my-home/versions
          gh api --paginate "$VERSIONS_URL" | jq -s 'add' > versions.json
          jq -r '
            [ ("prod-", "test-") as $prefix
              | [ .[] | select(any(.metadata.container.tags[]; startswith($prefix))) ]
              | sort_by(.created_at) | reverse | .[:3][] | .id ] as $keep
            | .[] | select(.id as $id | $keep | index($id) | not) | .id
          ' versions.json | while read -r id; do
            echo "usuwam wersję $id"
            gh api -X DELETE "$VERSIONS_URL/$id"
          done
